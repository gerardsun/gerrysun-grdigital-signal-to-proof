<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Signal-to-Proof architecture</title>
  <desc id="desc">Decision, economics, behavior, data, correlation, identification, evidence gates, causal inference, claim ceiling, and business action.</desc>
  <rect width="1440" height="760" fill="#f5f0e7"/>
  <text x="80" y="88" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#161616">Signal-to-Proof</text>
  <text x="80" y="128" font-family="Arial, sans-serif" font-size="22" fill="#6a655d">Evidence-Gated Correlation &amp; Causality Modeling</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80 190)">
      <rect width="220" height="104" rx="18" fill="#fffdf8" stroke="#d8d0c3"/>
