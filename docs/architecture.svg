      <text x="24" y="72" font-size="22" font-weight="700" fill="#161616">Product + UX signals</text>
    </g>
    <text x="858" y="248" font-size="30" fill="#b8322a">→</text>
    <g transform="translate(890 190)">
      <rect width="220" height="104" rx="18" fill="#fffdf8" stroke="#d8d0c3"/>
      <text x="24" y="40" font-size="16" font-weight="700" fill="#b8322a">04 DATA</text>
      <text x="24" y="72" font-size="22" font-weight="700" fill="#161616">Grain + joins + controls</text>
    </g>
    <text x="1128" y="248" font-size="30" fill="#b8322a">→</text>
    <g transform="translate(1160 190)">
