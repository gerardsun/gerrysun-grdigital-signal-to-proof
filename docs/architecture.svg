      <text x="24" y="40" font-size="16" font-weight="700" fill="#e25a50">05 MODEL</text>
      <text x="24" y="72" font-size="22" font-weight="700" fill="#ffffff">Correlation + controls</text>
    </g>

    <path d="M1270 294 L1270 365 L1130 365" fill="none" stroke="#b8322a" stroke-width="3"/>
    <polygon points="1128,365 1140,358 1140,372" fill="#b8322a"/>

    <g transform="translate(890 330)">
      <rect width="220" height="104" rx="18" fill="#fffdf8" stroke="#d8d0c3"/>
      <text x="24" y="40" font-size="16" font-weight="700" fill="#b8322a">06 IDENTIFICATION</text>
      <text x="24" y="72" font-size="22" font-weight="700" fill="#161616">Alternative explanations</text>
    </g>
    <text x="858" y="388" font-size="30" fill="#b8322a">←</text>
    <g transform="translate(620 330)">
      <rect width="220" height="104" rx="18" fill="#fffdf8" stroke="#d8d0c3"/>
      <text x="24" y="40" font-size="16" font-weight="700" fill="#b8322a">07 EVIDENCE GATES</text>
      <text x="24" y="72" font-size="22" font-weight="700" fill="#161616">Pass / warn / fail</text>
