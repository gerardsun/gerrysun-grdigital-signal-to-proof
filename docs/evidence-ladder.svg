<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Signal-to-Proof evidence ladder</title>
  <desc id="desc">Six levels from observed signal to causal experiment.</desc>
  <rect width="1440" height="520" fill="#f5f0e7"/>
  <text x="80" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#161616">Evidence ladder</text>
  <text x="80" y="118" font-family="Arial, sans-serif" font-size="21" fill="#6a655d">Model sophistication does not determine evidence strength. Identification does.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80 180)"><rect width="190" height="180" rx="18" fill="#fffdf8" stroke="#d8d0c3"/><text x="20" y="44" font-size="15" font-weight="700" fill="#b8322a">01</text><text x="20" y="82" font-size="22" font-weight="700" fill="#161616">Observed</text><text x="20" y="110" font-size="22" font-weight="700" fill="#161616">signal</text><text x="20" y="145" font-size="15" fill="#6a655d">What happened?</text></g>
    <g transform="translate(290 180)"><rect width="190" height="180" rx="18" fill="#fffdf8" stroke="#d8d0c3"/><text x="20" y="44" font-size="15" font-weight="700" fill="#b8322a">02</text><text x="20" y="82" font-size="22" font-weight="700" fill="#161616">Directional</text><text x="20" y="110" font-size="22" font-weight="700" fill="#161616">association</text><text x="20" y="145" font-size="15" fill="#6a655d">What moves together?</text></g>
    <g transform="translate(500 180)"><rect width="190" height="180" rx="18" fill="#fffdf8" stroke="#d8d0c3"/><text x="20" y="44" font-size="15" font-weight="700" fill="#b8322a">03</text><text x="20" y="82" font-size="22" font-weight="700" fill="#161616">Controlled</text><text x="20" y="110" font-size="22" font-weight="700" fill="#161616">association</text><text x="20" y="145" font-size="15" fill="#6a655d">Does it survive controls?</text></g>
    <g transform="translate(710 180)"><rect width="190" height="180" rx="18" fill="#fffdf8" stroke="#d8d0c3"/><text x="20" y="44" font-size="15" font-weight="700" fill="#b8322a">04</text><text x="20" y="82" font-size="22" font-weight="700" fill="#161616">Matched</text><text x="20" y="110" font-size="22" font-weight="700" fill="#161616">association</text><text x="20" y="145" font-size="15" fill="#6a655d">Do comparable groups differ?</text></g>
    <g transform="translate(920 180)"><rect width="190" height="180" rx="18" fill="#fffdf8" stroke="#d8d0c3"/><text x="20" y="44" font-size="15" font-weight="700" fill="#b8322a">05</text><text x="20" y="82" font-size="22" font-weight="700" fill="#161616">Quasi-</text><text x="20" y="110" font-size="22" font-weight="700" fill="#161616">experimental</text><text x="20" y="145" font-size="15" fill="#6a655d">What is incremental under assumptions?</text></g>
    <g transform="translate(1130 180)"><rect width="230" height="180" rx="18" fill="#161616"/><text x="20" y="44" font-size="15" font-weight="700" fill="#e25a50">06</text><text x="20" y="82" font-size="22" font-weight="700" fill="#ffffff">Causal</text><text x="20" y="110" font-size="22" font-weight="700" fill="#ffffff">experiment</text><text x="20" y="145" font-size="15" fill="#ded7cc">What changed because we intervened?</text></g>
  </g>
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#161616">Outcome depth and causal strength are separate dimensions.</text>
  <text x="80" y="466" font-family="Arial, sans-serif" font-size="19" fill="#6a655d">A transaction match can be deep in the funnel while still being weaker causal evidence than a randomized test of an intermediate outcome.</text>
</svg>
